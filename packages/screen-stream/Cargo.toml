[package]
name = "screen-stream"
version = "0.1.0"
edition = "2021"
description = "AnyShare E-2 screen streaming engine prototype (capture layer)"

[dependencies]
anyhow = "1.0.104"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
