[package]
name = "screen-stream"
version = "0.1.0"
edition = "2021"
description = "AnyShare E-2 screen streaming engine prototype (capture layer)"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
minifb = { version = "0.29", optional = true }
openh264 = { version = "0.9", optional = true }
socket2 = "0.5"

[features]
viewer = ["dep:openh264", "dep:minifb", "dep:image"]

[[bin]]
name = "ss-view"
path = "src/bin/ss-view.rs"
required-features = ["viewer"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
