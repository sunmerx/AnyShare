[package]
name = "screen-stream"
version = "0.1.0"
edition = "2021"
description = "AnyShare E-2 screen streaming engine prototype (capture layer)"

[dependencies]
anyhow = "1.0.104"
libloading = { version = "0.8", optional = true }
# AnyShare modification 2026-10-19: winit replaces minifb (fullscreen +
# working presentation under Wayland/XWayland sessions).
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"], optional = true }
softbuffer = { version = "0.4", optional = true }
openh264 = { version = "0.9", optional = true }
socket2 = "0.5"

[features]
viewer = ["dep:openh264", "dep:winit", "dep:softbuffer", "dep:libloading"]

[[bin]]
name = "ss-view"
path = "src/bin/ss-view.rs"
required-features = ["viewer"]

[[bin]]
name = "ss-h264dbg"
path = "src/bin/ss-h264dbg.rs"
required-features = ["viewer"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
